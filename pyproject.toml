[project]
name = "loki-tail-mcp"
version = "0.2.0"
description = "MCP server for Grafana Loki: LLM-friendly log search with fuzzy container-name rescue"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nick Engel", email = "nick@engel.au" }]
requires-python = ">=3.12"
keywords = ["mcp", "model-context-protocol", "loki", "grafana", "logs", "logql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Logging",
]
dependencies = [
    # The kit pins the MCP SDK range (mcp<2) for every server built on it.
    "mcp-server-kit>=0.1,<0.2",
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/snickery/loki-tail-mcp"
Issues = "https://github.com/snickery/loki-tail-mcp/issues"

[project.scripts]
loki-tail-mcp = "loki_tail_mcp.server:main"
# Legacy alias from the project's original name — existing client
# registrations and container CMDs that spawn `loki-mcp` keep working.
loki-mcp = "loki_tail_mcp.server:main"

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loki_tail_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
